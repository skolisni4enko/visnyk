# NSIS installer config for Wails
# Build with: wails build -platform windows/amd64 -nsis
# Requires: NSIS 3.08+ (choco install nsis)
# Signing: set CSC_LINK and CSC_KEY_PASSWORD env (see scripts/sign-windows.sh)

!define PRODUCT_NAME "Visnyk"
!define PRODUCT_VERSION "0.3.0"
!define COMPANY_NAME "Visnyk"
!define PRODUCT_PUBLISHER "Visnyk Team"
!define PRODUCT_WEB_SITE "https://github.com/visnyk/visnyk"
!define PRODUCT_DIR_REGKEY "Software\Microsoft\Windows\CurrentVersion\App Paths\visnyk.exe"
!define PRODUCT_UNINST_KEY "Software\Microsoft\Windows\CurrentVersion\Uninstall\Visnyk"
!define PRODUCT_UNINST_ROOT_KEY "HKLM"

# Install dir: Program Files\Visnyk, data stays in %AppData%\visnyk (UserConfigDir)
