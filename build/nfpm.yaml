name: visnyk
arch: amd64
platform: linux
version: 0.1.1
section: utils
priority: optional
maintainer: Visnyk Team <team@visnyk.local>
description: |
  Broadcast messenger for WA, TG, Viber.
  Checks number availability and delivers to all available messengers.
  0.1.1: added direct send — Send WA and Send TG buttons alongside
  broadcast to all. Direct send targets a single messenger without fallback
  and reports contact not found in WhatsApp/Telegram or send failure.
  Delay 8-15s + jitter, logging and history are preserved.
vendor: Visnyk
homepage: https://github.com/visnyk/visnyk
license: MIT
bindir: /usr/bin
contents:
  - src: ./build/bin/visnyk
    dst: /usr/bin/visnyk
    file_info:
      mode: 0755
  - src: ./build/debian/visnyk.desktop
    dst: /usr/share/applications/visnyk.desktop
    file_info:
      mode: 0644
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/visnyk.png
    file_info:
      mode: 0644
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/visnyk.png
    file_info:
      mode: 0644
  - src: ./build/appicon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/visnyk.svg
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/visnyk/copyright
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6
      - libgtk-3-0
      - libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
    recommends:
      - libayatana-appindicator3-1
    suggests: []
    compression: gzip
