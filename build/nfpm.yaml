name: visnyk
arch: amd64
platform: linux
version: 0.3.0
section: utils
priority: optional
maintainer: Visnyk Team <team@visnyk.local>
description: |
  Broadcast messenger for WA, TG, Viber.
  Checks number availability and delivers to all available messengers.
  0.3.0: broadcast file attachments (1 file per batch, template as
  caption, long texts auto-split into follow-ups, WA audio caption
  fallback), 16MB media / 100MB documents.
  0.2.0: Telegram resolve-first send (no address-book pollution), parallel
  WA/TG delivery with per-channel pacing and full FLOOD_WAIT handling,
  circuit breaker on dead sessions, background health monitor, bulk paste
  auto-tidies numbers into one column. Delay 8-15s + jitter, logging and
  history are preserved.
vendor: Visnyk
homepage: https://github.com/visnyk/visnyk
license: MIT
bindir: /usr/bin
contents:
  - src: ./build/bin/visnyk
    dst: /usr/bin/visnyk
    file_info:
      mode: 0755
  - src: ./build/debian/visnyk.desktop
    dst: /usr/share/applications/visnyk.desktop
    file_info:
      mode: 0644
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/visnyk.png
    file_info:
      mode: 0644
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/visnyk.png
    file_info:
      mode: 0644
  - src: ./build/appicon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/visnyk.svg
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/visnyk/copyright
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6
      - libgtk-3-0
      - libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37
    recommends:
      - libayatana-appindicator3-1
    suggests: []
    compression: gzip
